<title>AI Engineer Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky progress header, month/week sidebar on the left, one month of week cards on the right. */
:root{
  --paper:#f4f7f5; --surface:#ffffff; --sunk:#eaf0ed;
  --ink:#13201a; --ink2:#46564f; --ink3:#7f8d87; --line:#d8e2dd;
  --accent:#006a4e; --accent-soft:rgba(0,106,78,.10); --on-accent:#ffffff;
  --mark:#d42a3c; --mark-soft:rgba(212,42,60,.10);
  --p0:#5b6b8c; --p1:#2f6fb0; --p2:#006a4e; --p3:#8a5a00; --p4:#7a4aa8; --p5:#b0476a; --p6:#4f7d2e;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --bn:'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1412; --surface:#151d1a; --sunk:#1b2521;
  --ink:#e4ece8; --ink2:#a9b7b1; --ink3:#73817b; --line:#26322d;
  --accent:#3cc18f; --accent-soft:rgba(60,193,143,.13); --on-accent:#08130f;
  --mark:#ff6474; --mark-soft:rgba(255,100,116,.13);
  --p0:#93a3c4; --p1:#6aa7e6; --p2:#3cc18f; --p3:#e0a83a; --p4:#b58ae0; --p5:#e687a8; --p6:#93c46a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1412; --surface:#151d1a; --sunk:#1b2521;
  --ink:#e4ece8; --ink2:#a9b7b1; --ink3:#73817b; --line:#26322d;
  --accent:#3cc18f; --accent-soft:rgba(60,193,143,.13); --on-accent:#08130f;
  --mark:#ff6474; --mark-soft:rgba(255,100,116,.13);
  --p0:#93a3c4; --p1:#6aa7e6; --p2:#3cc18f; --p3:#e0a83a; --p4:#b58ae0; --p5:#e687a8; --p6:#93c46a;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 12px;display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:center}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .bn{font-family:var(--bn);font-size:13px;color:var(--ink3);margin-top:2px}
.overall{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.big-pct{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.overall-meta{font-size:12.5px;color:var(--ink2);line-height:1.35}
.overall-meta .sync{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.phases{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.phases span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}

/* Layout */
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
nav.side{position:sticky;top:150px;max-height:calc(100vh - 170px);overflow-y:auto;padding-right:4px}
.mo{border-radius:10px;margin-bottom:4px}
.mo-btn{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.mo-btn:hover{background:var(--sunk)}
.mo.active .mo-btn{background:var(--accent-soft)}
.mo-name{font-family:var(--display);font-weight:700;font-size:15px}
.mo-pct{font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mo.active .mo-pct{color:var(--accent)}
.mo-bar{grid-column:1/-1;height:3px;background:var(--sunk);border-radius:9px;overflow:hidden}
.mo-bar>i{display:block;height:100%;width:0;background:var(--accent)}
.wk-list{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;display:none}
.mo.active .wk-list{display:block}
.wk-link{width:100%;display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink2)}
.wk-link:hover{background:var(--sunk);color:var(--ink)}
.wk-link .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-link .n{font-family:var(--mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wk-link.done .n{color:var(--accent);font-weight:500}
.wk-link.now{color:var(--ink);font-weight:500}
.wk-link.now .dot{box-shadow:0 0 0 3px var(--mark-soft);background:var(--mark)}

/* Month strip (phones) */
.strip{display:none;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.strip button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.strip button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* Month header */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:16px}
.mhead h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.05;margin:0;letter-spacing:-.015em}
.mhead p{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:62ch}
.mstat{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.mstat b{font-family:var(--display);font-size:24px;color:var(--accent);display:block;line-height:1.1}

/* Week card */
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;scroll-margin-top:160px;overflow:hidden}
.week.now{border-color:var(--mark)}
.whead{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:16px 18px;border:0;background:none;cursor:pointer;text-align:left}
.wmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.wnum{color:var(--ink2);font-weight:500}
.chip-phase{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:11.5px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:99px;padding:2px 9px}
.nowtag{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mark);background:var(--mark-soft);border-radius:99px;padding:2px 8px}
.wtitle{grid-column:1;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.wprog{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:10px}
.ring{width:46px;height:46px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.ring text{font-family:var(--mono);font-size:11px;fill:var(--ink);font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;color:var(--ink3);transition:transform .2s}
.week.open .chev{transform:rotate(180deg)}
.wbody{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.week.open .wbody{display:block}
.goal{margin:14px 0 4px;font-size:15px;max-width:68ch}
.goal b{font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:18px 0 8px}
.tgroups{display:grid;gap:10px}
.tg{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;align-items:start}
.tg-name{font-size:12.5px;font-weight:600;color:var(--ink2);padding-top:3px}
.tg-chips{display:flex;flex-wrap:wrap;gap:5px}
.tc{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:6px;padding:2px 8px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px;border-radius:8px;cursor:pointer}
.task:hover{background:var(--sunk)}
.task input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--ink3);border-radius:6px;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task span{font-size:14.5px}
.task input:checked+span{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.wk-actions{display:flex;justify-content:flex-end;margin-top:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;padding:4px 6px;border-radius:6px}
.linkbtn:hover{background:var(--accent-soft)}
.deliver{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.deliver .lbl{margin:0 0 3px;color:var(--accent)}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res a,.res span{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent);color:var(--accent)}
.res span{color:var(--ink2);border-style:dashed}
.tip{margin-top:14px;font-size:13.5px;color:var(--ink2);padding-left:12px;border-left:2px solid var(--line)}
.tip b{color:var(--ink);font-weight:600}
.empty-note{font-size:13px;color:var(--ink3);margin-top:28px}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-block:14px 60px}
  nav.side{display:none}
  .strip{display:flex}
  .top-in{grid-template-columns:1fr;padding:12px 16px 10px}
  .overall{justify-content:flex-start}
  .wrap,.top-in{padding-inline:16px}
  .tg{grid-template-columns:minmax(0,1fr)}
  .whead{padding:14px}
  .wbody{padding:0 14px 14px}
  .phases{display:none}
  .top{position:static}
  .mstat{text-align:left}
  .week{scroll-margin-top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>AI Engineer Roadmap</h1>
      <div class="bn">শেখো · বানাও · ডিপ্লয় করো · চাকরি নাও &nbsp;|&nbsp; Oct 2026 to Jun 2027 · 20 to 25 h/week</div>

</div>

<script>
const PHASES = {
  P0:{name:"Foundations", c:"--p0"},
  P1:{name:"Backend for AI", c:"--p1"},
  P2:{name:"LLM engineering", c:"--p2"},

  P4:{name:"Cloud + MLOps", c:"--p4"},
  P5:{name:"Interview fundamentals", c:"--p5"},

};

/* Each week: id, start, end (ISO), phase, title, goal, groups [[name,[topics]]], tasks [], deliver, res [[label,url]], tip */
const WEEKS = [
{id:"w1",start:"2026-10-05",end:"2026-10-11",phase:"P0",title:"Python for production",
 goal:"Write Python like a software engineer: typed, structured, packaged and logged.",
 groups:[["Language",["type hints","dataclasses","decorators","generators & yield","context managers","*args / **kwargs","comprehensions"]],["Async",["async / await","asyncio.gather","event loop basics","sync vs async I/O"]],["Tooling",["venv or uv","pyproject.toml","logging module","pathlib","typer / argparse"]]],
 tasks:["Read the typing and dataclasses docs, then add full type hints to one of your thesis scripts","Write 3 decorators yourself (timer, retry, simple cache) and one generator that streams a large file line by line","Write an async script that processes 20 files or URLs concurrently with asyncio.gather and compare the time with a normal loop","Refactor one thesis preprocessing step into a package with pyproject.toml and a small CLI","Replace print statements with the logging module (levels, format, file handler)","DSA: solve 4 Easy problems on arrays and hashing"],

{id:"w2",start:"2026-10-12",end:"2026-10-18",phase:"P0",title:"Git, Linux and DSA patterns",
 goal:"Use Git and the terminal confidently, and start the DSA habit that runs until you are hired.",

 deliver:"A clean GitHub profile with a profile README and pinned repositories.",
 res:[["Learn Git Branching","https://learngitbranching.js.org/"],["Pro Git book","https://git-scm.com/book/en/v2"],["Missing Semester (MIT)","https://missing.csail.mit.edu/"],["NeetCode roadmap","https://neetcode.io/roadmap"]],

{id:"w3",start:"2026-10-19",end:"2026-10-25",phase:"P1",title:"SQL and PostgreSQL",

 deliver:"A FastAPI app with CRUD routes and a working /docs page.",

{id:"w5",start:"2026-11-02",end:"2026-11-08",phase:"P1",title:"Database layer",

/* ---------- helpers ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const p = s => ({y:+s.slice(0,4), m:+s.slice(5,7), d:+s.slice(8,10)});
const fmt = s => { const a=p(s); return `${MON[a.m-1]} ${a.d}`; };
const range = w => w.month ? `${MONFULL[p(w.start).m-1]} ${p(w.start).y}` : `${fmt(w.start)} to ${fmt(w.end)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const tid = (w,i) => `${w.id}-t${i+1}`;

/* months by week start */
const MONTHS = [];
WEEKS.forEach((w,i) => {
  w.num = w.month ? null : i+1;
  const a = p(w.start), key = `${a.y}-${a.m}`;
  let m = MONTHS.find(x => x.key === key);
  if (!m) { m = {key, label:`${MON[a.m-1]} ${a.y}`, full:`${MONFULL[a.m-1]} ${a.y}`, weeks:[]}; MONTHS.push(m); }
  m.weeks.push(w);
});
const MONTH_INTRO = {
  "2026-10":"Engineering foundations, then SQL and FastAPI. The flagship backend begins.",
  "2026-11":"Finish the backend: database layer, auth, tests and Docker. Then LLM engineering starts.",
  "2026-12":"The core of AI engineering: RAG, evaluation and agents on top of your backend.",
  "2027-1":"Fine-tune and serve your own models, release BanglaWriteLM, then deploy to the cloud.",
  "2027-2":"CI/CD and monitoring finish the product. Then two weeks of interview theory.",
  "2027-3":"CV, applications, system design and mock interviews, balanced with BSc exams.",
  "2027-4":"Applications and interviews at a steady weekly rhythm.",
  "2027-5":"Offers, first freelance work and the thesis paper.",
  "2027-6":"Start the job and keep the Fall 2028 MSc plan moving."
};
MONTHS.forEach(m => { m.intro = MONTH_INTRO[m.key] || ""; });

const todayISO = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
const nowWeek = WEEKS.find(w => todayISO >= w.start && todayISO <= w.end) || (todayISO < WEEKS[0].start ? WEEKS[0] : null);
const isNow = w => nowWeek && nowWeek.id === w.id && todayISO >= w.start;

/* ---------- state ---------- */
const LKEY = "aiEngRoadmap.v1";
let checked = {};
try { checked = JSON.parse(localStorage.getItem(LKEY) || "{}").checked || {}; } catch(e) {}
const saveLocal = () => { try { localStorage.setItem(LKEY, JSON.stringify({checked})); } catch(e) {} };

const total = () => WEEKS.reduce((n,w)=>n+w.tasks.length,0);
const doneIn = w => w.tasks.filter((_,i)=>checked[tid(w,i)]).length;
const pct = (a,b) => b ? Math.round(a*100/b) : 0;

let curMonth = Math.max(0, MONTHS.findIndex(m => m.weeks.some(w => nowWeek && w.id===nowWeek.id)));
const openSet = new Set(nowWeek ? [nowWeek.id] : []);

/* ---------- render ---------- */
function legend(){
  document.getElementById("legend").innerHTML = Object.values(PHASES).map(ph =>
    `<span><i class="dot" style="--c:var(${ph.c})"></i>${esc(ph.name)}</span>`).join("");
}
function renderSide(){
  const side = document.getElementById("side");
  side.innerHTML = MONTHS.map((m,mi) => `
    <div class="mo${mi===curMonth?" active":""}" data-m="${mi}">
      <button class="mo-btn" type="button" data-month="${mi}" aria-expanded="${mi===curMonth}">
        <span class="mo-name">${esc(m.label)}</span><span class="mo-pct" data-mpct="${mi}">0%</span>
        <span class="mo-bar"><i data-mbar="${mi}"></i></span>
      </button>
      <ul class="wk-list">${m.weeks.map(w => `
        <li><button class="wk-link${isNow(w)?" now":""}" type="button" data-week="${w.id}">
          <i class="dot" style="--c:var(${PHASES[w.phase].c})"></i>
          <span class="t">${w.month ? "" : "W"+w.num+" · "}${esc(w.title)}</span>
          <span class="n" data-wn="${w.id}"></span>
        </button></li>`).join("")}
      </ul>
    </div>`).join("");
  document.getElementById("strip").innerHTML = MONTHS.map((m,mi) =>
    `<button type="button" role="tab" aria-selected="${mi===curMonth}" class="${mi===curMonth?"active":""}" data-month="${mi}">${esc(m.label)} · <span data-spct="${mi}">0%</span></button>`).join("");
}
function ring(w){
  const r=19, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle class="bg" cx="23" cy="23" r="${r}"/><circle class="fg" data-ring="${w.id}" cx="23" cy="23" r="${r}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" data-rt="${w.id}">0%</text></svg>`;
}
function renderMonth(){
  const m = MONTHS[curMonth];
  const phases = [...new Set(m.weeks.map(w=>w.phase))].map(k=>PHASES[k].name).join(", ");
  document.getElementById("month").innerHTML = `
    <div class="mhead">
      <div><h2>${esc(m.full)}</h2><p>${esc(m.intro)} <span style="color:var(--ink3)">Phase: ${esc(phases)}.</span></p></div>
      <div class="mstat"><b data-mhead-pct>0%</b><span data-mhead-n></span></div>
    </div>
    ${m.weeks.map(w => {
      const ph = PHASES[w.phase];
      return `<article class="week${openSet.has(w.id)?" open":""}${isNow(w)?" now":""}" id="${w.id}">
        <button class="whead" type="button" data-toggle="${w.id}" aria-expanded="${openSet.has(w.id)}" aria-controls="b-${w.id}">
          <div class="wmeta">
            ${w.month ? `<span class="wnum">Month plan</span>` : `<span class="wnum">Week ${w.num}</span>`}
            <span>${esc(range(w))}</span>
            <span class="chip-phase" style="--c:var(${ph.c})"><i class="dot"></i>${esc(ph.name)}</span>
            ${isNow(w)?`<span class="nowtag">This week</span>`:""}
          </div>
          <h3 class="wtitle">${esc(w.title)}</h3>
          <div class="wprog"><span class="mo-pct" data-wcount="${w.id}"></span>${ring(w)}
            <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </button>
        <div class="wbody" id="b-${w.id}">
          <p class="goal"><b>Goal:</b> ${esc(w.goal)}</p>
          <div class="lbl">Topics</div>
          <div class="tgroups">${w.groups.map(([g,ts]) => `<div class="tg"><div class="tg-name">${esc(g)}</div><div class="tg-chips">${ts.map(t=>`<span class="tc">${esc(t)}</span>`).join("")}</div></div>`).join("")}</div>
          <div class="lbl">Tasks</div>
          <ul class="tasks">${w.tasks.map((t,i) => `<li><label class="task"><input type="checkbox" id="cb-${tid(w,i)}" data-task="${tid(w,i)}"${checked[tid(w,i)]?" checked":""}><span>${esc(t)}</span></label></li>`).join("")}</ul>
          <div class="wk-actions"><button class="linkbtn" type="button" data-all="${w.id}">Mark all done</button></div>
          <div class="deliver"><div class="lbl">Done when</div>${esc(w.deliver)}</div>
          ${w.res.length ? `<div class="lbl">Resources</div><div class="res">${w.res.map(([l,u]) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>` : `<span>${esc(l)}</span>`).join("")}</div>` : ""}
          ${w.tip ? `<p class="tip"><b>Tip:</b> ${esc(w.tip)}</p>` : ""}
        </div>
      </article>`;}).join("")}
    ${curMonth < MONTHS.length-1 ? `<button class="btn" type="button" data-month="${curMonth+1}" style="margin-top:6px">Next: ${esc(MONTHS[curMonth+1].full)} →</button>` : `<p class="empty-note">End of the roadmap. Good luck with the job and the MSc.</p>`}`;
}
function updateProgress(){
  const T = total(); let D = 0;
  WEEKS.forEach(w => {
    const d = doneIn(w), n = w.tasks.length, pc = pct(d,n); D += d;
    document.querySelectorAll(`[data-wn="${w.id}"]`).forEach(e => { e.textContent = d===n ? "✓" : `${pc}%`; e.parentElement.classList.toggle("done", d===n); });
    const r = document.querySelector(`[data-ring="${w.id}"]`);
    if (r) { const c = 2*Math.PI*19; r.setAttribute("stroke-dashoffset", (c*(1-d/n)).toFixed(2)); }
    const rt = document.querySelector(`[data-rt="${w.id}"]`); if (rt) rt.textContent = `${pc}%`;
    const wc = document.querySelector(`[data-wcount="${w.id}"]`); if (wc) wc.textContent = `${d}/${n}`;
    const ab = document.querySelector(`[data-all="${w.id}"]`); if (ab) ab.textContent = d===n ? "Clear this week" : "Mark all done";
  });
  MONTHS.forEach((m,mi) => {
    const n = m.weeks.reduce((a,w)=>a+w.tasks.length,0), d = m.weeks.reduce((a,w)=>a+doneIn(w),0), pc = pct(d,n);
    const a = document.querySelector(`[data-mpct="${mi}"]`); if (a) a.textContent = `${pc}%`;
    const b = document.querySelector(`[data-mbar="${mi}"]`); if (b) b.style.width = `${pc}%`;
    const s = document.querySelector(`[data-spct="${mi}"]`); if (s) s.textContent = `${pc}%`;
    if (mi === curMonth) {
      const h = document.querySelector("[data-mhead-pct]"); if (h) h.textContent = `${pc}%`;
      const hn = document.querySelector("[data-mhead-n]"); if (hn) hn.textContent = `${d} of ${n} tasks`;
    }
  });
  const op = pct(D,T);
  document.getElementById("ovPct").textContent = `${op}%`;
  document.getElementById("ovBar").style.width = `${op}%`;
  document.getElementById("ovCount").textContent = `${D} of ${T} tasks done`;
}
function applyChecked(){
  document.querySelectorAll("[data-task]").forEach(cb => { cb.checked = !!checked[cb.dataset.task]; });
  updateProgress();
}
function selectMonth(mi, scrollTop=true){
  curMonth = mi; renderSide(); renderMonth(); updateProgress();
  if (scrollTop) window.scrollTo({top:0, behavior:"smooth"});
}
function goWeek(id){
  const mi = MONTHS.findIndex(m => m.weeks.some(w=>w.id===id));
  openSet.add(id);
  if (mi !== curMonth) selectMonth(mi, false); else { renderMonth(); updateProgress(); }
  const el = document.getElementById(id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const mb = e.target.closest("[data-month]"); if (mb) { selectMonth(+mb.dataset.month); return; }
  const wb = e.target.closest("[data-week]"); if (wb) { goWeek(wb.dataset.week); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const id = tg.dataset.toggle, card = document.getElementById(id);
    const open = !card.classList.contains("open"); card.classList.toggle("open", open); tg.setAttribute("aria-expanded", open);
    open ? openSet.add(id) : openSet.delete(id); return; }
  const all = e.target.closest("[data-all]");
  if (all) { const w = WEEKS.find(x=>x.id===all.dataset.all); const full = doneIn(w)===w.tasks.length;
    w.tasks.forEach((_,i)=>{ if (full) delete checked[tid(w,i)]; else checked[tid(w,i)] = true; });
    applyChecked(); persist(); }
});
document.addEventListener("change", e => {
  const cb = e.target.closest("[data-task]"); if (!cb) return;
  if (cb.checked) checked[cb.dataset.task] = true; else delete checked[cb.dataset.task];
  updateProgress(); persist();
});
document.getElementById("goNow").addEventListener("click", () => goWeek((nowWeek || WEEKS[0]).id));

/* ---------- account sync (db) ---------- */
let ref = null, writing = false, dirty = false, timer = null;
const syncEl = document.getElementById("sync");
function persist(){
  saveLocal();
  if (!ref) return;
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush(){
  timer = null;
  if (writing) { dirty = true; return; }
  writing = true; syncEl.textContent = "Saving…";
  try { await ref.set({checked, updatedAt: new Date().toISOString()}); syncEl.textContent = "Saved to your account"; }
  catch (err) { if (err && err.code === "invalid_argument") { ref = null; } syncEl.textContent = "Saved in this browser only"; }
  writing = false;
  if (dirty) { dirty = false; flush(); }
}
(async () => {
  const c = window.claude; if (!c || !c.use) return;
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { syncEl.textContent = "Saved in this browser only"; return; }
    ref = db.doc(`data/users/${uid}/roadmap`);
    syncEl.textContent = "Syncing…";
    ref.onSnapshot(snap => {
      if (writing || timer || snap.metadata.hasPendingWrites) return;
      if (snap.exists) {
        const d = snap.data(); checked = Object.assign({}, d.checked || {}); saveLocal(); applyChecked();
      }
      syncEl.textContent = "Saved to your account";
    }, () => { ref = null; syncEl.textContent = "Saved in this browser only"; });
  } catch (e) { syncEl.textContent = "Saved in this browser only"; }
})();

legend(); renderSide(); renderMonth(); updateProgress();
</script>

</body></html>
