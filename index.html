<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Engineer Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Layout: sticky progress header, month/week sidebar on the left, one month of week cards on the right. */
      :root {
        --paper: #f4f7f5;
        --surface: #ffffff;
        --sunk: #eaf0ed;
        --ink: #13201a;
        --ink2: #46564f;
        --ink3: #7f8d87;
        --line: #d8e2dd;
        --accent: #006a4e;
        --accent-soft: rgba(0, 106, 78, 0.1);
        --on-accent: #ffffff;
        --mark: #d42a3c;
        --mark-soft: rgba(212, 42, 60, 0.1);
        --p0: #5b6b8c;
        --p1: #2f6fb0;
        --p2: #006a4e;
        --p3: #8a5a00;
        --p4: #7a4aa8;
        --p5: #b0476a;
        --p6: #4f7d2e;
        --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        --bn: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #0e1412;
          --surface: #151d1a;
          --sunk: #1b2521;
          --ink: #e4ece8;
          --ink2: #a9b7b1;
          --ink3: #73817b;
          --line: #26322d;
          --accent: #3cc18f;
          --accent-soft: rgba(60, 193, 143, 0.13);
          --on-accent: #08130f;
          --mark: #ff6474;
          --mark-soft: rgba(255, 100, 116, 0.13);
          --p0: #93a3c4;
          --p1: #6aa7e6;
          --p2: #3cc18f;
          --p3: #e0a83a;
          --p4: #b58ae0;
          --p5: #e687a8;
          --p6: #93c46a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: #0e1412;
        --surface: #151d1a;
        --sunk: #1b2521;
        --ink: #e4ece8;
        --ink2: #a9b7b1;
        --ink3: #73817b;
        --line: #26322d;
        --accent: #3cc18f;
        --accent-soft: rgba(60, 193, 143, 0.13);
        --on-accent: #08130f;
        --mark: #ff6474;
        --mark-soft: rgba(255, 100, 116, 0.13);
        --p0: #93a3c4;
        --p1: #6aa7e6;
        --p2: #3cc18f;
        --p3: #e0a83a;
        --p4: #b58ae0;
        --p5: #e687a8;
        --p6: #93c46a;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
      }
      a {
        color: var(--accent);
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* Header */
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .top-in {
        max-width: 1240px;
        margin: 0 auto;
        padding: 14px 20px 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 24px;
        align-items: center;
      }
      .brand h1 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(20px, 2.4vw, 26px);
        line-height: 1.15;
        margin: 0;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .brand .bn {
        font-family: var(--bn);
        font-size: 13px;
        color: var(--ink3);
        margin-top: 2px;
      }
      .overall {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .big-pct {
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      .overall-meta {
        font-size: 12.5px;
        color: var(--ink2);
        line-height: 1.35;
      }
      .overall-meta .sync {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink3);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .bar {
        grid-column: 1/-1;
        height: 6px;
        background: var(--sunk);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.35s ease;
      }
      .phases {
        grid-column: 1/-1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 12px;
        color: var(--ink2);
      }
      .phases span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--c);
      }

      /* Layout */
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding-inline: 20px;
        padding-block: 20px 60px;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      nav.side {
        position: sticky;
        top: 150px;
        max-height: calc(100vh - 170px);
        overflow-y: auto;
        padding-right: 4px;
      }
      .mo {
        border-radius: 10px;
        margin-bottom: 4px;
      }
      .mo-btn {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 0;
        background: none;
        border-radius: 10px;
        cursor: pointer;
        text-align: left;
      }
      .mo-btn:hover {
        background: var(--sunk);
      }
      .mo.active .mo-btn {
        background: var(--accent-soft);
      }
      .mo-name {
        font-family: var(--display);
        font-weight: 700;
        font-size: 15px;
      }
      .mo-pct {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
      }
      .mo.active .mo-pct {
        color: var(--accent);
      }
      .mo-bar {
        grid-column: 1/-1;
        height: 3px;
        background: var(--sunk);
        border-radius: 9px;
        overflow: hidden;
      }
      .mo-bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
      }
      .wk-list {
        list-style: none;
        margin: 2px 0 8px;
        padding: 0 0 0 12px;
        display: none;
      }
      .mo.active .wk-list {
        display: block;
      }
      .wk-link {
        width: 100%;
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 5px 8px;
        border: 0;
        background: none;
        border-radius: 7px;
        cursor: pointer;
        text-align: left;
        font-size: 13px;
        color: var(--ink2);
      }
      .wk-link:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .wk-link .t {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wk-link .n {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink3);
        font-variant-numeric: tabular-nums;
      }
      .wk-link.done .n {
        color: var(--accent);
        font-weight: 500;
      }
      .wk-link.now {
        color: var(--ink);
        font-weight: 500;
      }
      .wk-link.now .dot {
        box-shadow: 0 0 0 3px var(--mark-soft);
        background: var(--mark);
      }

      /* Month strip (phones) */
      .strip {
        display: none;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 14px;
      }
      .strip button {
        flex: none;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 99px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .strip button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* Month header */
      .mhead {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px 20px;
        margin-bottom: 16px;
      }
      .mhead h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(26px, 3.4vw, 36px);
        line-height: 1.05;
        margin: 0;
        letter-spacing: -0.015em;
      }
      .mhead p {
        margin: 4px 0 0;
        color: var(--ink2);
        font-size: 14px;
        max-width: 62ch;
      }
      .mstat {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink2);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .mstat b {
        font-family: var(--display);
        font-size: 24px;
        color: var(--accent);
        display: block;
        line-height: 1.1;
      }

      /* Week card */
      .week {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 14px;
        scroll-margin-top: 160px;
        overflow: hidden;
      }
      .week.now {
        border-color: var(--mark);
      }
      .whead {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 16px;
        align-items: center;
        padding: 16px 18px;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      .wmeta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink3);
      }
      .wnum {
        color: var(--ink2);
        font-weight: 500;
      }
      .chip-phase {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--body);
        font-size: 11.5px;
        font-weight: 500;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 12%, transparent);
        border-radius: 99px;
        padding: 2px 9px;
      }
      .nowtag {
        font-family: var(--body);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mark);
        background: var(--mark-soft);
        border-radius: 99px;
        padding: 2px 8px;
      }
      .wtitle {
        grid-column: 1;
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        line-height: 1.2;
        margin: 2px 0 0;
        text-wrap: balance;
      }
      .wprog {
        grid-column: 2;
        grid-row: 1/3;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ring {
        width: 46px;
        height: 46px;
      }
      .ring circle {
        fill: none;
        stroke-width: 5;
      }
      .ring .bg {
        stroke: var(--sunk);
      }
      .ring .fg {
        stroke: var(--accent);
        stroke-linecap: round;
        transition: stroke-dashoffset 0.35s ease;
      }
      .ring text {
        font-family: var(--mono);
        font-size: 11px;
        fill: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .chev {
        width: 18px;
        height: 18px;
        color: var(--ink3);
        transition: transform 0.2s;
      }
      .week.open .chev {
        transform: rotate(180deg);
      }
      .wbody {
        display: none;
        padding: 0 18px 18px;
        border-top: 1px solid var(--line);
      }
      .week.open .wbody {
        display: block;
      }
      .goal {
        margin: 14px 0 4px;
        font-size: 15px;
        max-width: 68ch;
      }
      .goal b {
        font-weight: 600;
      }
      .lbl {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink3);
        margin: 18px 0 8px;
      }
      .tgroups {
        display: grid;
        gap: 10px;
      }
      .tg {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        gap: 4px 12px;
        align-items: start;
      }
      .tg-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink2);
        padding-top: 3px;
      }
      .tg-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .tc {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink2);
        background: var(--sunk);
        border-radius: 6px;
        padding: 2px 8px;
      }
      .tasks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .task {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 7px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .task:hover {
        background: var(--sunk);
      }
      .task input {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin: 2px 0 0;
        border: 1.5px solid var(--ink3);
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: var(--surface);
      }
      .task input:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .task input:checked::after {
        content: "";
        width: 5px;
        height: 10px;
        border: solid var(--on-accent);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg) translate(-1px, -1px);
      }
      .task span {
        font-size: 14.5px;
      }
      .task input:checked + span {
        color: var(--ink3);
        text-decoration: line-through;
        text-decoration-color: var(--ink3);
      }
      .wk-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .linkbtn {
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .linkbtn:hover {
        background: var(--accent-soft);
      }
      .deliver {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--accent-soft);
        font-size: 14px;
      }
      .deliver .lbl {
        margin: 0 0 3px;
        color: var(--accent);
      }
      .res {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .res a,
      .res span {
        font-size: 13px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        text-decoration: none;
        color: var(--ink);
      }
      .res a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .res span {
        color: var(--ink2);
        border-style: dashed;
      }
      .tip {
        margin-top: 14px;
        font-size: 13.5px;
        color: var(--ink2);
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .tip b {
        color: var(--ink);
        font-weight: 600;
      }
      .empty-note {
        font-size: 13px;
        color: var(--ink3);
        margin-top: 28px;
      }

      /* Projects */
      .side-lbl {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink3);
        padding: 12px 12px 4px;
      }
      .mo-name .count {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        color: var(--ink3);
        margin-left: 4px;
      }
      .pgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        gap: 14px;
      }
      .pcard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .pcard.flagship {
        grid-column: 1/-1;
        border-color: var(--accent);
      }
      .ptop {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .ptags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 6px;
      }
      .ptag {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink2);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 1px 8px;
      }
      .ptag.hot {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      .pname {
        font-family: var(--display);
        font-weight: 700;
        font-size: 19px;
        line-height: 1.2;
        margin: 0;
        text-wrap: balance;
      }
      .pring {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        flex: none;
      }
      .ppitch {
        margin: 0;
        font-size: 14.5px;
      }
      .pwhy {
        margin: 0;
        font-size: 13.5px;
        color: var(--ink2);
      }
      .pwhy b {
        color: var(--ink);
        font-weight: 600;
      }
      .pweeks,
      .builds {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .builds {
        margin-top: 10px;
      }
      .wkchip,
      .projchip {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .wkchip:hover,
      .projchip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .projchip {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent);
        font-weight: 500;
      }
      .pbullet {
        font-size: 13px;
        color: var(--ink2);
        background: var(--sunk);
        border-radius: 9px;
        padding: 10px 12px;
        font-style: italic;
      }
      .pbullet .lbl {
        display: block;
        font-style: normal;
      }
      .ptask {
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 5px;
        padding: 1px 6px;
        margin-right: 2px;
        white-space: nowrap;
      }
      .task input:checked + span .ptask {
        opacity: 0.6;
      }

      @media (max-width: 860px) {
        .wrap {
          grid-template-columns: minmax(0, 1fr);
          padding-block: 14px 60px;
        }
        nav.side {
          display: none;
        }
        .strip {
          display: flex;
        }
        .top-in {
          grid-template-columns: 1fr;
          padding: 12px 16px 10px;
        }
        .overall {
          justify-content: flex-start;
        }
        .wrap,
        .top-in {
          padding-inline: 16px;
        }
        .tg {
          grid-template-columns: minmax(0, 1fr);
        }
        .whead {
          padding: 14px;
        }
        .wbody {
          padding: 0 14px 14px;
        }
        .phases {
          display: none;
        }
        .top {
          position: static;
        }
        .mstat {
          text-align: left;
        }
        .week {
          scroll-margin-top: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <div class="brand">
          <h1>AI Engineer Roadmap</h1>
          <div class="bn">
            শেখো · বানাও · ডিপ্লয় করো · চাকরি নাও &nbsp;|&nbsp; 6-month plan: 5
            Oct 2026 to 4 Apr 2027 · 20 to 25 h/week
          </div>
        </div>
        <div class="overall">
          <div class="big-pct" id="ovPct">0%</div>
          <div class="overall-meta">

      }
      function setRing(key, d, n) {

      /* ---------- events ---------- */

      document.addEventListener("change", (e) => {

        persist();
      });
      document
        .getElementById("goNow")
        .addEventListener("click", () => goWeek((nowWeek || WEEKS[0]).id));

      /* ---------- account sync (db) ---------- */
      let ref = null,
        writing = false,
        dirty = false,
        timer = null;
      const syncEl = document.getElementById("sync");
      function persist() {
        saveLocal();
        if (!ref) return;
        clearTimeout(timer);
        timer = setTimeout(flush, 600);
      }
      async function flush() {
        timer = null;
        if (writing) {
          dirty = true;
          return;
        }
        writing = true;
        syncEl.textContent = "Saving…";
        try {
          await ref.set({ checked, updatedAt: new Date().toISOString() });
          syncEl.textContent = "Saved to your account";
        } catch (err) {
          if (err && err.code === "invalid_argument") {
            ref = null;
          }
          syncEl.textContent = "Saved in this browser only";
        }
        writing = false;
        if (dirty) {
          dirty = false;
          flush();
        }
      }
      (async () => {
        const c = window.claude;
        if (!c || !c.use) return;
        try {
          const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
          const uid = user ? await user.id() : null;
          if (!db || !uid) {
            syncEl.textContent = "Saved in this browser only";
            return;
          }
          ref = db.doc(`data/users/${uid}/roadmap-v2`);
          syncEl.textContent = "Syncing…";
          ref.onSnapshot(
            (snap) => {
              if (writing || timer || snap.metadata.hasPendingWrites) return;
              if (snap.exists) {
                const d = snap.data();
                checked = Object.assign({}, d.checked || {});
                saveLocal();
                applyChecked();
              }
              syncEl.textContent = "Saved to your account";
            },
            () => {
              ref = null;
              syncEl.textContent = "Saved in this browser only";
            },
          );
        } catch (e) {
          syncEl.textContent = "Saved in this browser only";
        }
      })();

      legend();
      renderSide();
      renderMonth();
      updateProgress();
    </script>
  </body>
</html>
